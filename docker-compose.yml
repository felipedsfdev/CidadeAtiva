name: cidadeativa

x-java-resources: &java-resources
  mem_limit: 512m
  cpus: 2.0

x-java-environment: &java-environment
  JAVA_TOOL_OPTIONS: "-Xms32m -Xmx192m"

x-mysql-resources: &mysql-resources
  mem_limit: 512m
  command: ["--innodb-buffer-pool-size=64M", "--max-connections=60"]

x-java-healthcheck: &java-healthcheck
  interval: 5s
  timeout: 4s
  retries: 24
  start_period: 25s

x-mysql-healthcheck: &mysql-healthcheck
  test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
  interval: 5s
  timeout: 4s
  retries: 24
  start_period: 30s

services:
  mysql-ocorrencias:
    <<: *mysql-resources
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cidadeativa_ocorrencias
      MYSQL_USER: cidadeativa
      MYSQL_PASSWORD: ocorrencias_dev
      MYSQL_ROOT_PASSWORD: root_ocorrencias_dev
    volumes:
      - dados-ocorrencias:/var/lib/mysql
    healthcheck: *mysql-healthcheck
    networks: [servicos]

  mysql-atendimentos:
    <<: *mysql-resources
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cidadeativa_atendimentos
      MYSQL_USER: cidadeativa
      MYSQL_PASSWORD: atendimentos_dev
      MYSQL_ROOT_PASSWORD: root_atendimentos_dev
    volumes:
      - dados-atendimentos:/var/lib/mysql
    healthcheck: *mysql-healthcheck
    networks: [servicos]

  eureka-server:
    <<: *java-resources
    environment: *java-environment
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    ports:
      - "127.0.0.1:8761:8761"
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
    networks: [servicos]

  api-gateway:
    <<: *java-resources
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      <<: *java-environment
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
    networks: [servicos]

  ocorrencias-service:
    <<: *java-resources
    build:
      context: .
      dockerfile: ocorrencias-service/Dockerfile
    environment:
      <<: *java-environment
      EUREKA_URL: http://eureka-server:8761/eureka/
      DB_URL: "jdbc:mysql://mysql-ocorrencias:3306/cidadeativa_ocorrencias?connectionTimeZone=UTC&sslMode=DISABLED&allowPublicKeyRetrieval=true"
      DB_USER: cidadeativa
      DB_PASSWORD: ocorrencias_dev
      MANAGEMENT_SERVER_PORT: "9090"
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql-ocorrencias:
        condition: service_healthy
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:9090/actuator/health/readiness"]
    networks: [servicos]

  atendimentos-service:
    <<: *java-resources
    build:
      context: .
      dockerfile: atendimentos-service/Dockerfile
    environment:
      <<: *java-environment
      EUREKA_URL: http://eureka-server:8761/eureka/
      DB_URL: "jdbc:mysql://mysql-atendimentos:3306/cidadeativa_atendimentos?connectionTimeZone=UTC&sslMode=DISABLED&allowPublicKeyRetrieval=true"
      DB_USER: cidadeativa
      DB_PASSWORD: atendimentos_dev
      MANAGEMENT_SERVER_PORT: "9090"
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql-atendimentos:
        condition: service_healthy
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:9090/actuator/health/readiness"]
    networks: [servicos]

networks:
  servicos:

volumes:
  dados-ocorrencias:
  dados-atendimentos:

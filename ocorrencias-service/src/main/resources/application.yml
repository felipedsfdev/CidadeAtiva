server:
  port: 0

spring:
  application:
    name: ocorrencias-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/cidadeativa_ocorrencias?connectionTimeZone=UTC&sslMode=DISABLED&allowPublicKeyRetrieval=true}
    username: ${DB_USER:cidadeativa}
    password: ${DB_PASSWORD:ocorrencias_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}
    lease-renewal-interval-in-seconds: 5
    status-page-url-path: /api/v1/ocorrencias
  client:
    registry-fetch-interval-seconds: 5
    initial-instance-info-replication-interval-seconds: 5
    healthcheck:
      enabled: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

springdoc:
  packages-to-scan: br.com.fiap.cidadeativa.ocorrencias.controller
  override-with-generic-response: false
  api-docs:
    path: /docs/ocorrencias/openapi
  swagger-ui:
    path: /docs/ocorrencias/swagger.html
    disable-swagger-default-url: true
